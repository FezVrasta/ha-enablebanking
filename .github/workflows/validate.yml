name: Validate

# Bare "push" on purpose: it fires for branches *and* tags, which is what lets the
# release-gate job below see tag pushes without a second workflow file.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit rather than @main: hacs/action is a third-party Docker action
      # that runs with repo context, and an unpinned ref means every scheduled run can
      # execute code nobody reviewed. Upstream's newest tag (22.5.0) is years stale and
      # main is the ref HACS documents, so the SHA below is main, not a release.
      - name: HACS Validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-06-08
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same reasoning as above. home-assistant/actions only ever tagged 1.0.0, so master
      # is the documented ref and this SHA is master.
      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master @ 2026-07-21

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # No uv.lock is committed, so nothing can match the cache key. On the
          # default (auto) setup-uv turns the cache on and then warns on every run
          # that it can never be invalidated.
          enable-cache: false
      # uv resolves and downloads the interpreter itself, so requires-python in
      # pyproject.toml stays the single source of truth for the Python version.
      # Note that floor is 3.14.2: every homeassistant release this integration
      # supports requires it, and a lower floor makes this step unsolvable.
      - name: Install dev dependencies
        run: uv sync --extra dev

      # No flags on any of the three commands, deliberately. ruff and mypy already read
      # their settings from pyproject.toml (including mypy's "files" list, which scopes
      # type checking to custom_components/enablebanking), so passing flags here would
      # let CI silently check something other than what a contributor checks locally.
      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  # No pytest job: this repo ships no tests/ directory yet. Adding an empty pytest run
  # would report green while proving nothing, so the job appears once real tests do.

  release-gate:
    # Tag pushes only. Without this check a tag can advertise one version while the
    # manifest HACS actually installs says another, which is exactly the drift this repo
    # already has (manifest 0.6.9, newest tag v0.6.2). Fail the tag build instead of
    # shipping the mismatch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [validate-hacs, validate-hassfest, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest version
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          # A leading "v" is stripped so both "0.6.9" and "v0.6.9" tags are accepted;
          # HACS itself normalises that away. Everything after the prefix must match
          # exactly, no "close enough".
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          manifest_path = next(pathlib.Path("custom_components").glob("*/manifest.json"))
          manifest_version = json.loads(manifest_path.read_text(encoding="utf-8"))["version"]
          pyproject_version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          problems = []
          if tag != manifest_version:
              problems.append(
                  f"tag version {tag!r} does not match {manifest_path} version {manifest_version!r}"
              )
          # pyproject is checked too: it is the version a "uv sync" contributor sees, and
          # letting it drift from the manifest makes the changelog untrustworthy.
          if manifest_version != pyproject_version:
              problems.append(
                  f"{manifest_path} version {manifest_version!r} does not match "
                  f"pyproject.toml version {pyproject_version!r}"
              )

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)

          print(f"Release {tag} is consistent across {manifest_path} and pyproject.toml.")
          PY
